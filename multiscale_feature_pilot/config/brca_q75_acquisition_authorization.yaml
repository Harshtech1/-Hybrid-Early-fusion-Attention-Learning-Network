  source: DIRECT_USER_AUTHORIZATION
  exact_user_statement: |
    I authorize downloading only BRCA Q75 UUID `25aec062-60d1-446e-a1c6-0c79cc74a770` (`1,360,743,825` bytes) from GDC to local persistent staging at concurrency one.

    After download, perform only:

    * exact UUID and filename verification;
    * exact byte-size verification;
    * MD5 verification against `a8c4b68fb6e0ab3e862efe3ed1fe10d7`;
    * independent SHA256 calculation;
    * partial/incomplete-download checks;
    * confirmation that the file is a regular non-symlink SVS;
    * OpenSlide **header-only** inspection for native MPP, pyramid level count, level dimensions, and level downsample values.

    Do **not** perform:

    * `read_region` or any pixel/region access;
    * tissue-mask generation;
    * coordinate generation;
    * patch extraction;
    * ResNet50 inference;
    * HEALNet execution;
    * Q75 feature generation;
    * Q75 raw-file deletion;
    * Google Drive operations;
    * full-cohort processing;
    * Q25/Q50 modification;
    * BLCA modification;
    * training.

    Reverify that the exact Q75 slide still matches patient `TCGA-E2-A154` and the exact Omic row before recording the metadata result.

    Fail closed on any UUID, filename, size, MD5, SHA256, file-type, OpenSlide-header, or patient/slide identity mismatch.

    After the header-only inspection, stop and report:

    * local WSI path;
    * exact size, MD5, and SHA256;
    * native `mpp-x` and `mpp-y`;
    * level count;
    * dimensions and downsample values for every pyramid level;
    * whether the approximately `0.5` and `1.0 µm/px` targets appear natively achievable or would require controlled resampling;
    * disk usage before/after;
    * Git status;
    * tests/validation performed;
    * files created or modified.

    Do not infer or approve the Q75 scale policy automatically. Stop after the metadata report and wait for my review.
  exact_user_statement_sha256: b43031fe0a9df8e5c44f35f9666567b202e4eb80ecb816386679a856a013bf01
